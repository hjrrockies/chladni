[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chladni"
version = "0.0.1"
description = "Laplacian eigenvalues and eigenfunctions of planar domains, by a GSVD-regularized Method of Particular Solutions"
authors = [{name = "Hayden Ringer", email = "hringer@vt.edu"}]
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = ["laplacian", "eigenvalues", "helmholtz", "method of particular solutions", "spectral geometry"]

dependencies = [
    "numpy >= 2.3",
    "scipy >= 1.14",
    "matplotlib >= 3.9",
    "shapely >= 2.0",
    # 0.3.0 removed tola/tolb (breaking). chladni's `reg="implicit"` was the only consumer
    # and went with them; nothing here passes a tolerance to the GSVD any more.
    "gsvd4py >= 0.3.0",
    # gsvd4py finds LAPACK's ?ggsvd3 by probing, and off macOS every probe misses. On macOS
    # it loads Accelerate and is done; elsewhere it looks for a scipy_openblas32/64 PACKAGE,
    # for a global `dggsvd3_`, or for a system lapack/openblas/flexiblas. A pip-installed
    # scipy satisfies none of those: its manylinux wheel bundles libscipy_openblas privately
    # under scipy.libs, loaded RTLD_LOCAL with the symbols prefixed `scipy_`. So gsvd4py
    # raises ImportError -- at CALL time, deep inside coef_of, not at import -- and its
    # message ("Ensure scipy is installed") sends you the wrong way, because scipy is
    # installed and does not help. Depending on the package directly is what makes its
    # second probe hit. Not test-only: the GSVD is the eigensolver, so a Linux user of
    # chladni needs this exactly as much as CI does.
    "scipy-openblas32 >= 0.3.29; sys_platform != 'darwin'",
]

[project.optional-dependencies]
# What the test suite needs, and nothing else. CI installs this rather than [dev]: the
# jupyter metapackage pulls ~100 packages, of which the suite uses only nbformat, nbclient
# and ipykernel. Declaring them here also fixes a latent bug -- they were undeclared test
# dependencies that happened to arrive with jupyter, so a leaner environment would have
# silently skipped the notebook test rather than failing.
test = [
    "pytest >= 8.4",
    "mpmath >= 1.3",
    "nbformat >= 5.10",
    "nbclient >= 0.10",
    "ipykernel >= 6.29",
]
dev = [
    "chladni[test]",
    "jupyter >= 1.1",
]
# The douse acceptance benchmark (benchmarks/douse/): an independent FEM cross-check for
# reference spectra on shapes with no closed form. Not needed by src/ or the test suite.
bench = [
    "scikit-fem >= 12.0.2",
]

# src layout: unlike lappy's flat layout, this keeps tests/, docs/ and benchmarks/ out of
# setuptools' auto-discovery entirely, so no explicit package list is needed.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not slow and not gate and not robust'"
markers = [
    "slow: costs seconds rather than milliseconds -- end-to-end solves, notebook\n        execution, scaling guards. DESELECTED BY DEFAULT via addopts, to keep the inner\n        loop at ~1.5 s. Run them with `-m slow`, or everything with `-m ''`.",
    "gate: the V1 acceptance gate, RETIRED from the suite 2026-10-09 to\n        notes/evidence_tests/test_gate.py (run it there with -m gate). Kept as a marker so that\n        module still selects.",
    "ulp_sensitive: the outcome flips under ulp-level perturbation of the pencil (tests/ulp_jitter.py)\n        and across CPUs on Linux CI -- a decision the solver cannot yet make robustly, not a\n        bit-level contract. Excluded from per-push CI; measured by notes/jitter_sweep.py, where\n        the target is 0 of N seeds failing.",
    "not_under_jitter: compares the pencil's assembly with itself, so tests/ulp_jitter.py (which\n        patches it) would fail it by construction. Skipped when CHLADNI_ULP_JITTER is set.",
    "robust: the full robustness campaign -- whole grids rather than the slices the slow tier\n        carries, 30-60 minutes when complete. DESELECTED BY DEFAULT via addopts; run with\n        `-m robust`.",
]
